<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scratch 小游戏 · 胡建宇</title>
  <meta name="description" content="胡建宇的 Scratch 小游戏合集，1600+ 个游戏在线直接玩，支持搜索。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="games">
  <!-- 页面标题 -->
  <section class="games-hero">
    <div class="container">
      <h1>🎮 Scratch 小游戏</h1>
      <p id="gamesSubtitle">游戏加载中…</p>
    </div>
  </section>

  <!-- 搜索栏 + 随机按钮 -->
  <section class="section games-list-section">
    <div class="container">
      <div class="game-toolbar">
        <div class="game-search">
          <span class="game-search-icon">🔍</span>
          <input type="text" id="gameSearch" role="searchbox" enterkeyhint="search" placeholder="输入游戏名字，一键搜索（比如：玛丽、坦克、僵尸）" autocomplete="off" />
          <button class="game-search-clear" id="gameSearchClear" hidden title="清空搜索" aria-label="清空搜索">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8" /></svg>
          </button>
        </div>
        <button class="btn btn-primary game-random" id="gameRandom" title="随机挑一个游戏开玩">🎲 随机来一个</button>
      </div>
      <p class="game-count" id="gameCount"></p>

      <!-- 游戏网格（JS 从 games.json 动态渲染） -->
      <div class="game-grid2" id="gamesGrid"></div>

      <div class="games-more-wrap">
        <button class="btn btn-outline" id="gamesMore" hidden>加载更多 ↓</button>
      </div>

      <div class="games-empty" id="gamesEmpty" hidden>
        <div class="games-empty-icon">🔍</div>
        <h2>没找到这个游戏</h2>
        <p>换个关键词试试吧～</p>
      </div>
    </div>
  </section>

  <!-- 游戏播放弹窗 -->
  <div class="game-modal-mask" id="gameModal" hidden>
    <div class="game-modal" role="dialog" aria-modal="true">
      <div class="game-modal-head">
        <p class="game-modal-title" id="gameModalTitle"></p>
        <div class="game-modal-actions">
          <button class="game-modal-min" id="gameModalMin" title="最小化，稍后再玩" aria-label="最小化">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path class="ico-min" d="M4.2 8h7.6" /></svg>
          </button>
          <button class="game-modal-full" id="gameModalFull" title="全屏" aria-label="全屏">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <rect class="ico-max" x="4.3" y="4.3" width="7.4" height="7.4" rx="1.9" />
              <rect class="ico-restore" x="3.4" y="6.6" width="6" height="6" rx="1.7" />
              <path class="ico-restore" d="M6.6 6.6v-1a1.7 1.7 0 0 1 1.7-1.7h2.8a1.7 1.7 0 0 1 1.7 1.7v2.8a1.7 1.7 0 0 1-1.7 1.7h-1" />
            </svg>
          </button>
          <button class="game-modal-close" id="gameModalClose" title="关闭（停止游戏）" aria-label="关闭游戏">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8" /></svg>
          </button>
        </div>
      </div>
      <div class="game-modal-stage" id="gameModalStage"></div>
      <p class="game-modal-tip">提示：点 ▶ 绿旗开始 · <b>—</b> 最小化到右下角（点一下继续玩） · <b>▢</b> 全屏 · <b>✕</b> 关闭并停止游戏 · 玩的时候会自动帮你缓冲后面 3 个游戏</p>
    </div>
  </div>

  <footer class="footer">
    <p>© <span id="year"></span> 胡建宇 · 用 ❤️ 与好奇心 构建 · 托管于 GitHub Pages</p>
  </footer>

  <!-- 站点壳 + 全局播放器 + 游戏页脚本：播放器常驻，换页不断歌 -->
  <script src="js/site.js"></script>
  <script src="js/player.js"></script>
  <script src="js/page-games.js"></script>
</body>
</html>
